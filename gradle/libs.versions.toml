[versions]
min-sdk = "33"
compile-sdk = "37"
target-sdk = "37"
jdk = "21"
agp = "9.4.1"
kotlin = "2.4.20"
activity = "1.13.0"
compose-material3 = "1.5.0-alpha28"
core = "1.19.0"
core-splashscreen = "1.2.0"
lifecycle = "2.11.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
